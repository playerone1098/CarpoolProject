version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: carpool_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carpool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mock-data.sql:/docker-entrypoint-initdb.d/01-mock-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carpool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carpool_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
